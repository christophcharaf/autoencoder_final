alerting:
  # Configuración de threshold
  threshold:
    method: "percentile"     # percentile, fixed, adaptive
    percentile: 99.5         # para método percentile (increased to reduce false positives)
    fixed_value: null        # para método fixed
    adaptive_window: 168     # horas para método adaptativo
    
  # Configuración Opsgenie
  opsgenie:
    api_key: "${OPSGENIE_API_KEY}"
    team: "platform-ops"
    base_url: "https://api.opsgenie.com"
    default_priority: "P3"
    timeout_seconds: 10
    # Priority is determined by confidence (reconstruction error above threshold).
    # confidence > P1 threshold → P1 (critical), > P2 → P2, > P3 → P3, else P4
    priority_thresholds:
      P1: 2.0
      P2: 1.0
      P3: 0.5
    
  # Configuración Grafana
  grafana:
    base_url: "${GRAFANA_URL}"
    dashboard_uid: "tv-metrics-dashboard"
    default_time_range: "30m"
    refresh_interval: "30s"
    
  # Control de alertas
  rate_limiting:
    min_interval_seconds: 300                      # Min time between Opsgenie alerts (same anomaly)
    max_alerts_per_hour: 10                        # TODO: Not yet implemented
    enable_deduplication: true                     # Enable smart anomaly tracking
    min_confidence: 0.25                           # Minimum confidence to alert (25% above threshold)
    severity_tolerance: 0.2                        # ±20% for same anomaly detection
    heartbeat_interval_seconds: 180                # Log ongoing status every 3 minutes
    send_resolved_notification: true               # Send alert when anomaly clears
    escalation_threshold_minutes: 30               # Re-alert if anomaly persists 30+ minutes
    escalation_interval_minutes: 15                # Re-alert every 15 minutes after first escalation
