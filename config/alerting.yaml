alerting:
  # Configuración de threshold
  threshold:
    method: "percentile"     # percentile, fixed, adaptive
    percentile: 99.5         # para método percentile (increased to reduce false positives)
    fixed_value: null        # para método fixed
    adaptive_window: 168     # horas para método adaptativo
    
  # Proveedor de notificaciones: "jsm", "telegram" u "opsgenie".
  # JSM (Jira Service Management Operations) es el sucesor de Opsgenie, que entró
  # en fin de vida (sin altas nuevas desde junio de 2025; apagado el 5 de abril de
  # 2027). Como la capa de alertas es HTTP, el canal es intercambiable.
  provider: "jsm"

  # Configuración JSM (Jira Service Management Operations).
  # Endpoint de integración, compatible con Opsgenie (cabecera GenieKey y mismo
  # payload). La api_key se obtiene creando una "API integration" en JSM
  # (Operations > Settings > Integrations > API).
  jsm:
    api_key: "${JSM_API_KEY}"
    base_url: "https://api.atlassian.com/jsm/ops/integration"
    default_priority: "P3"
    timeout_seconds: 10
    # Prioridad derivada de la confianza (mismo criterio que Opsgenie).
    priority_thresholds:
      P1: 2.0
      P2: 1.0
      P3: 0.5

  # Configuración Telegram (Bot API)
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    base_url: "https://api.telegram.org"
    timeout_seconds: 10
    # Prioridad derivada de la confianza (mismo criterio que Opsgenie).
    priority_thresholds:
      P1: 2.0
      P2: 1.0
      P3: 0.5

  # Configuración Opsgenie (legado; conservada por compatibilidad)
  opsgenie:
    api_key: "${OPSGENIE_API_KEY}"
    team: "platform-ops"
    base_url: "https://api.opsgenie.com"
    default_priority: "P3"
    timeout_seconds: 10
    # Priority is determined by confidence (reconstruction error above threshold).
    # confidence > P1 threshold → P1 (critical), > P2 → P2, > P3 → P3, else P4
    priority_thresholds:
      P1: 2.0
      P2: 1.0
      P3: 0.5
    
  # Configuración Grafana
  grafana:
    base_url: "${GRAFANA_URL}"
    dashboard_uid: "tv-metrics-dashboard"
    default_time_range: "30m"
    refresh_interval: "30s"
    
  # Control de alertas
  rate_limiting:
    min_interval_seconds: 300                      # Min time between Opsgenie alerts (same anomaly)
    max_alerts_per_hour: 10                        # TODO: Not yet implemented
    enable_deduplication: true                     # Enable smart anomaly tracking
    min_confidence: 0.25                           # Minimum confidence to alert (25% above threshold)
    consecutive_anomaly_cycles: 2                  # Require N consecutive anomalous cycles before opening a new alert
    severity_tolerance: 0.2                        # ±20% for same anomaly detection
    heartbeat_interval_seconds: 30                 # Log ongoing status every 30 seconds
    send_resolved_notification: true               # Send alert when anomaly clears
    escalation_threshold_minutes: 30               # Re-alert if anomaly persists 30+ minutes
    escalation_interval_minutes: 15                # Re-alert every 15 minutes after first escalation
