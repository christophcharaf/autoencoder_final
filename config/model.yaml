model:
  # Arquitectura del autoencoder
  architecture:
    encoder_layers: [64, 32, 16]
    decoder_layers: [16, 32, 64]
    activation: "tanh"
    dropout: 0.1
    
  # Parámetros de entrenamiento
  training:
    batch_size: 32
    epochs: 50              # reducido para MVP
    early_stopping: true
    patience: 10
    validation_split: 0.2
    
  # Hiperparámetros
  hyperparameters:
    learning_rate: 0.001
    optimizer: "adam"
    loss: "mse"
    
  # Configuración de modelo
  settings:
    verbose_training: 1
    save_best_only: true
    monitor_metric: "val_loss"
