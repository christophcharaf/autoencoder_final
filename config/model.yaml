model:
  # Rutas de modelo (base: models/lstm_autoencoder.h5 → .weights.h5 y _config.json)
  paths:
    base: models/lstm_autoencoder.h5

  # Arquitectura del autoencoder
  architecture:
    encoder_layers: [64, 32, 16]
    decoder_layers: [16, 32, 64]
    # activation: reserved for future use (currently hardcoded in model)
    dropout: 0.1
    
  # Parámetros de entrenamiento
  training:
    batch_size: 32
    epochs: 30              # reducido para MVP
    early_stopping: true
    patience: 10
    validation_split: 0.2
    
  # Hiperparámetros
  hyperparameters:
    learning_rate: 0.001
    optimizer: "adam"
    loss: "mse"
    
  # Configuración de modelo
  settings:
    verbose_training: 1
    # save_best_only, monitor_metric: reserved for ModelCheckpoint (not yet wired)
