windowing:
  # Configuración base para MVP
  window_size: 20          # Número de timesteps en cada secuencia
                           # Tiempo cubierto: window_size × sampling_interval = 20 × 30s = 10 minutos
  stride: 20               # Training: paso entre ventanas (20 = sin solapamiento)
                           # Inference: NO se usa (siempre toma los últimos window_size puntos)
  
  # Configuraciones experimentales (para Fase 2)
  experimental:
    enable_overlap: false  # deshabilitado en MVP
    stride_options: [1, 3, 5, 10, 20]
    window_size_options: [15, 20, 25, 30]
  
  # Multi-escala (futuro)
  multi_scale:
    enable: false
    short_window: 10       # 5 min - anomalías agudas
    medium_window: 20      # 10 min - degradación gradual  
    long_context: 120      # 60 min - contexto estacional
