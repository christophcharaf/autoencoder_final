windowing:
  # Configuración base para MVP
  window_size: 20          # Número de timesteps en cada secuencia
                           # Tiempo cubierto: window_size × sampling_interval = 20 × 30s = 10 minutos
  stride: 1                # Training: paso entre ventanas (1 = max overlap, ~20x more training data)
                           # Inference: NO se usa (siempre toma los últimos window_size )
                           #
                           # Why stride=1? (Troubleshooting Issue 4) Originally stride=20 (non-overlapping).
                           # Model showed 100% false positive rate on Prometheus data. Fix: fixed_minmax
                           # scaler + stride=1. 20x more windows → better LSTM representation of normal
                           # patterns → training loss 0.0021, Prometheus MSE 0.005, 80.5% headroom.
  
