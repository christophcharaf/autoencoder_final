version: '3.8'

services:
  anomaly-detection:
    build: .
    container_name: tv-anomaly-detector-mamba
    restart: unless-stopped
    
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - PROMETHEUS_TOKEN=${PROMETHEUS_TOKEN:-}
      - OPSGENIE_API_KEY=${OPSGENIE_API_KEY:-}
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config:ro
      
    networks:
      - monitoring
    
    healthcheck:
      test: ["CMD", "python", "-c", "import tensorflow as tf; print('OK')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Servicios de desarrollo (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    profiles:
      - dev

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dev/grafana:/etc/grafana/provisioning
    networks:
      - monitoring
    profiles:
      - dev

  jupyter:
    build: .
    container_name: jupyter-dev
    ports:
      - "8888:8888"
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    volumes:
      - .:/app
      - ./notebooks:/app/notebooks
    environment:
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - monitoring
    profiles:
      - dev

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
