name: tv-anomaly-detection
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.8
  
  # Core ML stack (conda-forge tiene builds optimizados)
  - numpy=1.21.*
  - pandas=1.5.*
  - scikit-learn=1.3.*
  
  # TensorFlow (conda-forge tiene mejor soporte GPU)
  - tensorflow=2.13.*
  
  # Visualization y EDA
  - matplotlib=3.7.*
  - seaborn=0.12.*
  - plotly=5.17.*
  
  # Development environment
  - jupyter
  - jupyterlab=4.0.*
  - ipykernel
  - notebook
  - ipywidgets
  
  # HTTP y networking
  - requests=2.31.*
  - urllib3=2.0.*
  
  # Configuration y utils  
  - pyyaml=6.0.*
  - python-dotenv=1.0.*
  - joblib=1.3.*
  
  # Testing framework
  - pytest=7.4.*
  - pytest-cov=4.1.*
  - pytest-mock=3.11.*
  
  # Code quality
  - black=23.9.*
  - flake8=6.1.*
  - isort=5.12.*
  - mypy=1.6.*
  
  # Profiling y debugging
  - memory_profiler=0.61.*
  - line_profiler=4.1.*
  
  # Documentation
  - sphinx=7.2.*
  - sphinx-rtd-theme=1.3.*
  
  # Package management
  - pip=23.2.*
  
  # Dependencies only available via pip
  - pip:
    - prometheus-api-client>=0.5.0
