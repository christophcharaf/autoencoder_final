global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Mock TV-over-IP service
  - job_name: 'mock-tv-service'
    static_configs:
      - targets: ['mock-service:8000']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
